# /etc/nginx/sites-available/ocl-i18n.lairdubois.fr
# Certificate : certbot --nginx -d ocl-i18n.lairdubois.fr

upstream ocl_i18n {
  server 127.0.0.1:3007 fail_timeout=0;
}

server {
  listen 80;
  listen [::]:80;
  server_name ocl-i18n.lairdubois.fr;

  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ocl-i18n.lairdubois.fr;

  ssl_certificate     /etc/letsencrypt/live/ocl-i18n.lairdubois.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ocl-i18n.lairdubois.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /var/www/ocl-i18n/app/public;
  client_max_body_size 10m;

  # Digest-stamped assets served by NGINX directly
  location /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    gzip_static on;
    try_files $uri =404;
  }

  location / {
    try_files $uri @app;
  }

  location @app {
    proxy_pass http://ocl_i18n;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    # Publishing (clone + commit + push) and the Transifex import can take a while
    proxy_read_timeout 300s;
  }
}
